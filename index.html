<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMS LEGENDS 2026 - CYBERPUNK SHOWCASE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

    :root {
      --neon-red: #ff0055;
      --neon-cyan: #00f0ff;
      --cyber-black: #050508;
      --card-bg: rgba(12, 12, 20, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      background-color: var(--cyber-black);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
      padding: 15px 10px;
    }

    /* Animated Matrix/Grid Background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Header Cyberpunk */
    header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--neon-red);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
      clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
    }

    .logo-title {
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 8px var(--neon-red);
    }

    .tag-2026 {
      background: var(--neon-red);
      color: #000;
      font-size: 0.75rem;
      padding: 2px 6px;
      font-weight: 900;
      margin-left: 6px;
    }

    /* Title Header */
    .title-box {
      text-align: center;
      margin: 5px 0;
    }

    .title-box h1 {
      font-size: 1.4rem;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 2px 2px 0px var(--neon-red), -2px -2px 0px var(--neon-cyan);
    }

    .title-box p {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.8rem;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      font-weight: 700;
    }

    /* 3D Stage Container for Spinning Card */
    .card-container {
      width: 100%;
      height: 440px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    .cyber-card {
      width: 320px;
      height: 430px;
      background: var(--card-bg);
      border: 2px solid var(--neon-red);
      position: relative;
      clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.3s;
    }

    /* Animasi Putaran Spin Clockwise (Next) */
    .spin-next {
      animation: cyberSpinNext 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Animasi Putaran Spin Counter-Clockwise (Prev) */
    .spin-prev {
      animation: cyberSpinPrev 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes cyberSpinNext {
      0% {
        transform: rotateY(0deg) scale(1);
        filter: brightness(1);
      }
      50% {
        transform: rotateY(180deg) scale(0.6);
        filter: brightness(2) drop-shadow(0 0 30px var(--neon-cyan));
      }
      100% {
        transform: rotateY(360deg) scale(1);
        filter: brightness(1);
      }
    }

    @keyframes cyberSpinPrev {
      0% {
        transform: rotateY(0deg) scale(1);
        filter: brightness(1);
      }
      50% {
        transform: rotateY(-180deg) scale(0.6);
        filter: brightness(2) drop-shadow(0 0 30px var(--neon-red));
      }
      100% {
        transform: rotateY(-360deg) scale(1);
        filter: brightness(1);
      }
    }

    /* Scanline effect */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--neon-cyan);
      opacity: 0.7;
      box-shadow: 0 0 10px var(--neon-cyan);
      animation: scan 3s linear infinite;
      z-index: 5;
    }

    @keyframes scan {
      0% { top: 0%; }
      100% { top: 100%; }
    }

    .card-img-box {
      width: 100%;
      height: 330px;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.15s ease-in-out, transform 0.15s ease-in-out;
    }

    .card-hud-info {
      height: 100px;
      background: #080810;
      border-top: 2px solid var(--neon-red);
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      color: var(--neon-cyan);
      margin-bottom: 4px;
    }

    .player-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--neon-red);
    }

    .player-role {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--neon-red);
      letter-spacing: 2px;
    }

    /* Nav Group Below Card Center */
    .nav-group-bottom {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 5px 0 10px 0;
      width: 100%;
    }

    .nav-btn {
      background: #000;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 10px 24px;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%);
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .nav-btn:hover, .nav-btn:active {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 20px var(--neon-cyan);
      transform: scale(1.05);
    }

    /* Cyber Panel Footer */
    .cyber-footer {
      width: 100%;
      background: rgba(10, 10, 16, 0.9);
      border: 1px solid var(--neon-cyan);
      padding: 12px 15px;
      font-size: 0.75rem;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      justify-content: space-between;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .footer-col h4 {
      color: var(--neon-cyan);
      font-size: 0.7rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .footer-col p {
      color: #ccc;
      font-weight: 600;
    }

    .footer-col span {
      color: var(--neon-red);
    }
  </style>
</head>
<body>

  <!-- Animated Matrix & Digital Grid Background -->
  <canvas id="bg-canvas"></canvas>

  <div class="container">
    <header>
      <div class="logo-title">
        MMS LEGENDS <span class="tag-2026">2026</span>
      </div>
    </header>

    <div class="title-box">
      <h1>OFFICIAL MAIN LINEUP</h1>
      <p>SYS.LOC: ONLINE // CLICK TO ROTATE</p>
    </div>

    <!-- Hologram Player Card -->
    <div class="card-container">
      <div class="cyber-card" id="cyber-card" onclick="nextCard()">
        <div class="scanline"></div>
        <div class="card-img-box">
          <img id="player-img" src="c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg" alt="Player">
        </div>
        <div class="card-hud-info">
          <div class="hud-header">
            <span id="player-status">STATUS: ACTIVE</span>
            <span id="player-id">ID: 001</span>
          </div>
          <div class="player-name" id="player-name">GONE</div>
          <div class="player-role" id="player-role">JUNGLER</div>
        </div>
      </div>
    </div>

    <!-- Navigation Buttons Moved to Bottom Center -->
    <div class="nav-group-bottom">
      <button class="nav-btn" onclick="prevCard()">&lt; PREV</button>
      <button class="nav-btn" onclick="nextCard()">NEXT &gt;</button>
    </div>

    <!-- Info Footer -->
    <div class="cyber-footer">
      <div class="footer-col">
        <h4>MANAGEMENT & CREW</h4>
        <p>Founder: <span>SUPERBRAIN</span></p>
        <p>Sponsor: <span>MIFZAL</span></p>
        <p>Editor: <span>HABIB</span></p>
      </div>
      <div class="footer-col">
        <h4>RESERVE ROSTER</h4>
        <p>Roamer: <span>MIFZAL</span></p>
      </div>
    </div>
  </div>

  <script>
    // Senarai Penuh 6 Pemain MMS LEGENDS
    const players = [
      { id: "ID: 001", status: "STATUS: ACTIVE", name: "GONE", role: "JUNGLER", image: "c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg" },
      { id: "ID: 002", status: "STATUS: ACTIVE", name: "SHIKO", role: "GOLDLANER", image: "c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg" },
      { id: "ID: 003", status: "STATUS: ACTIVE", name: "SUPERBRAIN", role: "ROAMER (CAPTAIN)", image: "c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg" },
      { id: "ID: 004", status: "STATUS: ACTIVE", name: "TATUT", role: "EXP LANER", image: "c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg" },
      { id: "ID: 005", status: "STATUS: ACTIVE", name: "SAIGONZ", role: "MIDLANER", image: "c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg" },
      { id: "ID: 006", status: "STATUS: RESERVE", name: "MIFZAL", role: "ROAMER (RESERVE)", image: "c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg" }
    ];

    let currentIndex = 0;
    let isAnimating = false;

    // Cyber Sound Pop Synth (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCyberPop() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    // Update Player & 3D Spin Animation
    function triggerSpinAnimation(direction) {
      if (isAnimating) return;
      isAnimating = true;

      const card = document.getElementById('cyber-card');
      const img = document.getElementById('player-img');
      const name = document.getElementById('player-name');
      const role = document.getElementById('player-role');
      const playerId = document.getElementById('player-id');
      const playerStatus = document.getElementById('player-status');

      playCyberPop();

      const animClass = direction === 'next' ? 'spin-next' : 'spin-prev';
      card.classList.add(animClass);

      setTimeout(() => {
        img.src = players[currentIndex].image;
        name.textContent = players[currentIndex].name;
        role.textContent = players[currentIndex].role;
        playerId.textContent = players[currentIndex].id;
        playerStatus.textContent = players[currentIndex].status;
      }, 300);

      setTimeout(() => {
        card.classList.remove(animClass);
        isAnimating = false;
      }, 600);
    }

    function nextCard() {
      if (isAnimating) return;
      currentIndex = (currentIndex + 1) % players.length;
      triggerSpinAnimation('next');
    }

    function prevCard() {
      if (isAnimating) return;
      currentIndex = (currentIndex - 1 + players.length) % players.length;
      triggerSpinAnimation('prev');
    }

    // Cyberpunk Matrix/Grid Background Animation
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: Math.random() * 20 + 10,
        speed: Math.random() * 3 + 1,
        color: Math.random() > 0.5 ? '#ff0055' : '#00f0ff'
      });
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      particles.forEach(p => {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x, p.y + p.length);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.stroke();

        p.y += p.speed;
        if (p.y > canvas.height) {
          p.y = -p.length;
          p.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
              </html>
