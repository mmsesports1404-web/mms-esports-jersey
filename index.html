<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMS LEGENDS 2026</title>
  <style>
    :root {
      --bg-dark: #070709;
      --card-bg: #111116;
      --red-primary: #ff1a3c;
      --red-glow: rgba(255, 26, 60, 0.6);
      --text-main: #ffffff;
      --text-sub: #8a8d9b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif, system-ui;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
      padding: 20px 10px;
    }

    /* Animated Canvas Background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Header */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5px;
    }

    .logo-title {
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag-2026 {
      background: var(--red-primary);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .nav-btn:hover {
      border-color: var(--red-primary);
      box-shadow: 0 0 10px var(--red-glow);
    }

    /* Showcase Title */
    .section-header {
      text-align: center;
    }

    .section-header h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 800;
      background: linear-gradient(180deg, #fff 0%, #aaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-header p {
      font-size: 0.7rem;
      color: var(--red-primary);
      letter-spacing: 1px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* Player Card Showcase */
    .showcase-wrapper {
      position: relative;
      width: 100%;
      height: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .card {
      position: absolute;
      width: 310px;
      height: 450px;
      background: #0f0f14;
      border-radius: 16px;
      border: 1px solid rgba(255, 26, 60, 0.3);
      box-shadow: 0 0 25px rgba(255, 26, 60, 0.25);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
    }

    .card-img-box {
      width: 100%;
      height: 360px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at center, #2a080c 0%, #000 100%);
    }

    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card-info {
      height: 90px;
      background: #0b0b0e;
      border-top: 1px solid rgba(255, 26, 60, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
    }

    .player-name {
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
    }

    .player-role {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--red-primary);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* Footer Info */
    .footer-info {
      width: 100%;
      background: rgba(15, 15, 20, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
    }

    .info-col h4 {
      color: var(--text-sub);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .info-col p {
      color: #eee;
      margin-bottom: 3px;
    }

    .info-col span {
      color: var(--red-primary);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Animated Flame/Particles Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="container">
    <header>
      <div class="logo-title">
        MMS LEGENDS <span class="tag-2026">2026</span>
      </div>
      <div>
        <button class="nav-btn" onclick="prevCard()">&lt; PREV</button>
        <button class="nav-btn" onclick="nextCard()">NEXT &gt;</button>
      </div>
    </header>

    <div class="section-header">
      <h1>Official Main Lineup</h1>
      <p>Click Card to Rotate • 3D Cinematic Showcase</p>
    </div>

    <!-- 3D Card Carousel -->
    <div class="showcase-wrapper" onclick="nextCard()">
      <div class="card" id="player-card">
        <div class="card-img-box">
          <img id="player-img" src="c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg" alt="Player Image">
        </div>
        <div class="card-info">
          <div class="player-name" id="player-name">GONE</div>
          <div class="player-role" id="player-role">JUNGLER</div>
        </div>
      </div>
    </div>

    <div class="footer-info">
      <div class="info-col">
        <h4>Management & Crew</h4>
        <p>Founder: <span>SUPERBRAIN</span></p>
        <p>Sponsor: <span>MIFZAL</span></p>
        <p>Organizer / Editor: <span>HABIB</span></p>
      </div>
      <div class="info-col">
        <h4>Reserve Roster</h4>
        <p>Roamer (Reserve): <span>MIFZAL</span></p>
      </div>
    </div>
  </div>

  <script>
    // Data Senarai Pemain
    const players = [
      {
        name: "GONE",
        role: "JUNGLER",
        image: "c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg"
      },
      {
        name: "SHIKO",
        role: "GOLDLANER",
        image: "IMG-20261002-WA0000.jpg"
      },
      {
        name: "SUPERBRAIN",
        role: "ROAMER (CAPTAIN)",
        image: "c57478d1-2ddc-4dde-8272-9f0804d24d1a.jpeg"
      }
    ];

    let currentIndex = 0;

    // Web Audio API Sound Pop (Tanpa perlu file audio luaran)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playPopSound() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // Fungsi Menukar Kad Pemain
    function updateCard() {
      const card = document.getElementById('player-card');
      const img = document.getElementById('player-img');
      const name = document.getElementById('player-name');
      const role = document.getElementById('player-role');

      // Kesan Animasi Tukar Kad
      card.style.transform = 'scale(0.9) rotateY(20deg)';
      card.style.opacity = '0.5';

      setTimeout(() => {
        img.src = players[currentIndex].image;
        name.textContent = players[currentIndex].name;
        role.textContent = players[currentIndex].role;

        card.style.transform = 'scale(1) rotateY(0deg)';
        card.style.opacity = '1';
      }, 150);
    }

    function nextCard() {
      playPopSound();
      currentIndex = (currentIndex + 1) % players.length;
      updateCard();
    }

    function prevCard() {
      playPopSound();
      currentIndex = (currentIndex - 1 + players.length) % players.length;
      updateCard();
    }

    // Interactive Particles Background Animation
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 65; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 0.5,
        speedY: Math.random() * 1.5 + 0.5,
        speedX: (Math.random() - 0.5) * 0.5,
        alpha: Math.random()
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 26, 60, ${p.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff1a3c';
        ctx.fill();

        p.y -= p.speedY;
        p.x += p.speedX;

        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(animateParticles);
    }

    animateParticles();
  </script>
</body>
              </html>
