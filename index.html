<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMS Esports - Official 2026 Jersey Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #060606;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        /* Top Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 10, 10, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-area {
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 18px;
            color: #ff1e1e;
        }
        /* Cinematic Showcase Stage */
        .showcase-section {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle at center, #1c1c1c 0%, #060606 80%);
            padding: 40px 20px;
        }
        .showcase-title {
            text-align: center;
            margin-bottom: 30px;
        }
        .showcase-title h1 {
            font-size: clamp(28px, 5vw, 48px);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .showcase-title p {
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Carousel / 3D Slide Effect Container */
        .stage-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        .jersey-slide {
            position: absolute;
            width: 100%;
            max-width: 420px;
            opacity: 0;
            transform: scale(0.85) translateX(60px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }
        .jersey-slide.active {
            opacity: 1;
            transform: scale(1) translateX(0);
            pointer-events: auto;
            z-index: 10;
        }
        .jersey-slide.prev {
            opacity: 0.4;
            transform: scale(0.8) translateX(-120px);
            filter: blur(2px) brightness(0.6);
            z-index: 5;
        }
        .jersey-slide.next {
            opacity: 0.4;
            transform: scale(0.8) translateX(120px);
            filter: blur(2px) brightness(0.6);
            z-index: 5;
        }
        
        .jersey-slide img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Floor Reflection Effect */
        .stage-container::after {
            content: '';
            position: absolute;
            bottom: -30px;
            width: 80%;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(255, 30, 30, 0.3) 0%, transparent 70%);
            filter: blur(10px);
            z-index: 1;
        }

        /* Interactive Controls / Buttons */
        .controls-area {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            z-index: 20;
        }
        .control-btn {
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            border-color: #ff1e1e;
            background: #1a1a1a;
            box-shadow: 0 0 15px rgba(255, 30, 30, 0.4);
        }
        .control-btn.active {
            background: #ff1e1e;
            border-color: #ff1e1e;
            box-shadow: 0 0 25px rgba(255, 30, 30, 0.6);
        }

        /* Footer / Bottom Info */
        footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">MMS ESPORTS</div>
    </header>

    <section class="showcase-section">
        <div class="showcase-title">
            <h1>Official Jersey 2026</h1>
            <p>ONE TEAM &bull; ONE FAMILY</p>
        </div>

        <!-- Panggung Pameran Slider -->
        <div class="stage-container" id="stage">
            <!-- Paparan Depan -->
            <div class="jersey-slide active" id="slide-front">
                <img src="IMG-20261002-WA0000.jpg" alt="MMS Jersey Front">
            </div>
            <!-- Paparan Belakang (Simulasi efek slide/pusing) -->
            <div class="jersey-slide next" id="slide-back">
                <img src="IMG-20261002-WA0000.jpg" alt="MMS Jersey Back" style="transform: scaleX(-1);">
            </div>
        </div>

        <!-- Butang Tukar View Macam Kedai Pro -->
        <div class="controls-area">
            <button class="control-btn active" id="btn-front" onclick="changeSlide('front')">FRONT VIEW</button>
            <button class="control-btn" id="btn-back" onclick="changeSlide('back')">BACK VIEW</button>
        </div>
    </section>

    <footer>
        <small>Official Team Edition &bull; MMS / 2026</small>
    </footer>

    <script>
        function changeSlide(view) {
            const frontSlide = document.getElementById('slide-front');
            const backSlide = document.getElementById('slide-back');
            const btnFront = document.getElementById('btn-front');
            const btnBack = document.getElementById('btn-back');

            if (view === 'front') {
                frontSlide.className = 'jersey-slide active';
                backSlide.className = 'jersey-slide next';
                btnFront.className = 'control-btn active';
                btnBack.className = 'control-btn';
            } else {
                frontSlide.className = 'jersey-slide prev';
                backSlide.className = 'jersey-slide active';
                btnBack.className = 'control-btn active';
                btnFront.className = 'control-btn';
            }
        }
    </script>
</body>
</html>
